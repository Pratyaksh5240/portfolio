<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pratyaksh Soni | AI/ML Engineer Resume</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #0066ff;
            --secondary: #00d4ff;
            --bg-dark: #0a0a0f;
            --bg-glass: rgba(255, 255, 255, 0.05);
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.7);
            --border: rgba(255, 255, 255, 0.1);
            --gradient: linear-gradient(135deg, var(--primary), var(--secondary));
        }

        body {
            font-family: 'Inter', sans-serif;
            background:
                radial-gradient(ellipse at 20% 20%, rgba(0, 102, 255, 0.15), transparent 45%),
                radial-gradient(ellipse at 80% 10%, rgba(0, 212, 255, 0.1), transparent 40%),
                var(--bg-dark);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 2rem;
        }

        .topbar {
            max-width: 1000px;
            margin: 0 auto 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .brand {
            font-size: 1.4rem;
            font-weight: 800;
            background: var(--gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-decoration: none;
        }

        .actions {
            display: flex;
            gap: 0.75rem;
            flex-wrap: wrap;
        }

        .btn {
            padding: 0.8rem 1.25rem;
            border-radius: 50px;
            font-weight: 600;
            font-size: 0.9rem;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--text-primary);
            border: 1px solid var(--border);
            background: var(--bg-glass);
        }

        .btn-primary {
            border: none;
            background: var(--gradient);
            color: #fff;
        }

        .status {
            max-width: 1000px;
            margin: 0 auto 1rem;
            color: var(--text-secondary);
        }

        .resume {
            max-width: 1000px;
            margin: 0 auto;
            display: grid;
            gap: 1.5rem;
        }

        .page {
            position: relative;
            width: 100%;
            background: #fff;
            border-radius: 10px;
            border: 1px solid var(--border);
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
        }

        canvas {
            width: 100%;
            height: auto;
            display: block;
        }

        .link-layer {
            position: absolute;
            inset: 0;
        }

        .link-layer a {
            position: absolute;
            display: block;
            border-radius: 3px;
        }

        .link-layer a:hover,
        .link-layer a:focus {
            outline: 2px solid rgba(0, 102, 255, 0.7);
            background: rgba(0, 102, 255, 0.12);
        }

        @media (max-width: 640px) {
            body {
                padding: 1rem;
            }

            .topbar {
                align-items: flex-start;
            }
        }
    </style>
</head>
<body>
    <header class="topbar">
        <a href="index.html" class="brand">&lt;PS/&gt; Resume</a>
        <div class="actions">
            <a href="index.html" class="btn"><i class="fas fa-arrow-left"></i> Portfolio</a>
            <a href="assets/pratyaksh-soni-resume.pdf" class="btn btn-primary" id="downloadResume" download="Pratyaksh-Soni-Resume.pdf"><i class="fas fa-download"></i> Download PDF</a>
        </div>
    </header>

    <p class="status" id="status">Loading resume...</p>
    <main class="resume" id="resume"></main>

    <script type="module">
        import * as pdfjsLib from './assets/pdfjs/pdf.mjs';

        pdfjsLib.GlobalWorkerOptions.workerSrc = './assets/pdfjs/pdf.worker.mjs';

        const resume = document.getElementById('resume');
        const status = document.getElementById('status');
        const downloadResume = document.getElementById('downloadResume');
        const pdfUrl = 'assets/pratyaksh-soni-resume.pdf';

        downloadResume.addEventListener('click', async (event) => {
            event.preventDefault();
            const response = await fetch(pdfUrl);
            const blob = await response.blob();
            const downloadUrl = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = downloadUrl;
            link.download = 'Pratyaksh-Soni-Resume.pdf';
            document.body.appendChild(link);
            link.click();
            link.remove();
            URL.revokeObjectURL(downloadUrl);
        });

        function normalizeUrl(url) {
            if (!url) return '';
            return url.replace('/overlay/about-this-profile/', '/').split('?')[0];
        }

        function annotationUrl(annotation) {
            if (annotation.url || annotation.unsafeUrl) {
                return normalizeUrl(annotation.url || annotation.unsafeUrl);
            }
            return '';
        }

        async function renderPage(pdf, pageNumber) {
            const page = await pdf.getPage(pageNumber);
            const viewport = page.getViewport({ scale: 2 });
            const pageShell = document.createElement('section');
            pageShell.className = 'page';
            pageShell.style.aspectRatio = `${viewport.width} / ${viewport.height}`;

            const canvas = document.createElement('canvas');
            const context = canvas.getContext('2d', { alpha: false });
            canvas.width = Math.floor(viewport.width);
            canvas.height = Math.floor(viewport.height);
            pageShell.appendChild(canvas);

            await page.render({ canvasContext: context, viewport }).promise;

            const linkLayer = document.createElement('div');
            linkLayer.className = 'link-layer';
            const annotations = await page.getAnnotations();

            annotations.forEach((annotation) => {
                const url = annotationUrl(annotation);
                if (annotation.subtype !== 'Link' || !url || !annotation.rect) return;

                const rect = viewport.convertToViewportRectangle(annotation.rect);
                const left = Math.min(rect[0], rect[2]);
                const top = Math.min(rect[1], rect[3]);
                const width = Math.abs(rect[0] - rect[2]);
                const height = Math.abs(rect[1] - rect[3]);

                const anchor = document.createElement('a');
                anchor.href = url;
                anchor.setAttribute('aria-label', `Open ${url}`);
                anchor.style.left = `${(left / viewport.width) * 100}%`;
                anchor.style.top = `${(top / viewport.height) * 100}%`;
                anchor.style.width = `${(width / viewport.width) * 100}%`;
                anchor.style.height = `${(height / viewport.height) * 100}%`;
                linkLayer.appendChild(anchor);
            });

            pageShell.appendChild(linkLayer);
            resume.appendChild(pageShell);
        }

        try {
            const pdf = await pdfjsLib.getDocument(pdfUrl).promise;
            for (let pageNumber = 1; pageNumber <= pdf.numPages; pageNumber += 1) {
                await renderPage(pdf, pageNumber);
            }
            status.textContent = 'Resume loaded. Links inside the resume are clickable.';
        } catch (error) {
            status.textContent = 'Resume could not be loaded. Use the Download PDF button above.';
            console.error(error);
        }
    </script>
</body>
</html>
